<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UWTSD Pandemic Prototype</title>
<style>
:root{--n:#051425;--c:#081f37;--g:#f0b118;--b:#2d84c5;--r:#e24740;--s:#2fae6f;--w:#f5f8fc;--m:#a7b8c9}*{box-sizing:border-box}body{margin:0;background:#020b14;color:var(--w);font:16px/1.45 Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.app{width:min(100%,430px);min-height:100vh;background:var(--n);padding:18px;box-shadow:0 0 40px #000}.brand{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--g);padding-bottom:10px}.uw{background:var(--w);color:#102235;padding:7px 9px;border-radius:7px;font-weight:800;font-size:.75rem}.pan{color:var(--g);font-weight:900;letter-spacing:.1em;font-size:.78rem}h1{text-align:center;font-size:1.55rem;letter-spacing:.04em;margin:25px 0 4px}h2{font-size:1.05rem;color:var(--g);margin:12px 0 6px}.sub{text-align:center;color:var(--m);margin:0 0 18px}.card,.option,.note,.alert{background:var(--c);border:1px solid rgba(240,177,24,.35);border-radius:14px;padding:14px;margin:10px 0}.option{display:block;width:100%;text-align:left;color:var(--w);font-weight:700;cursor:pointer}.option small{display:block;color:var(--m);font-weight:400;margin-top:3px}.option:hover,.option:focus{outline:3px solid #8bd3ff}.selected,.primary{background:var(--g)!important;color:#152235!important;border-color:var(--g)!important}.danger{background:var(--r)!important;color:#fff!important}.success{background:var(--s)!important;color:#fff!important}.actions{display:grid;gap:10px;margin-top:18px}.actions.two{grid-template-columns:1fr 1fr}button,input{font:inherit}button{min-height:50px;border-radius:12px;border:1px solid rgba(240,177,24,.45);background:var(--c);color:var(--w);font-weight:800;padding:10px;cursor:pointer}input{width:100%;min-height:50px;border-radius:12px;border:1px solid #36506a;background:#06192c;color:var(--w);padding:12px}.map{position:relative;height:270px;margin:18px 0}.node{position:absolute;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#09243e;border:4px solid var(--b);font-weight:900}.node span{position:absolute;top:58px;font-size:.69rem;white-space:nowrap}.n1{left:10%;top:18%}.n2{right:10%;top:12%;border-color:var(--r)}.n3{left:41%;top:40%;border-color:#f28b32}.n4{left:10%;bottom:14%;border-color:var(--g)}.n5{right:10%;bottom:14%;border-color:var(--r)}.n6{left:41%;bottom:0;border-color:var(--s)}.bar{height:18px;background:#122a42;border-radius:9px;overflow:hidden;margin:6px 0}.fill{height:100%;background:var(--b)}.red{background:var(--r)}.yellow{background:var(--g)}.team{display:flex;justify-content:space-between;align-items:center}.status{font-size:.75rem;font-weight:800}.alert{background:#3b1018;border-color:var(--r);text-align:center}.alert .tri{font-size:3rem;color:var(--r)}.tools{display:flex;gap:8px;justify-content:center;margin:15px 0}.tools button{min-height:38px;font-size:.75rem}.large{font-size:19px}.contrast{--n:#000;--c:#111;--w:#fff;--m:#eee;--g:#ffdf00}.footer{text-align:center;color:var(--m);font-size:.72rem;margin-top:24px}.hidden{display:none}@media(min-width:700px){body{padding:30px}.app{width:min(92vw,760px);min-height:auto;border:2px solid #244a6a;border-radius:26px;padding:28px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{margin:0}h1{font-size:2rem}.map{max-width:520px;margin:18px auto}.actions{max-width:520px;margin:18px auto 0}}@media(min-width:1050px){.app{width:min(88vw,980px)}.screen{max-width:850px;margin:auto}.options.three{grid-template-columns:repeat(3,1fr)}}
</style></head><body><main class="app" id="app"><header class="brand"><div class="uw">UWTSD</div><div class="pan">PANDEMIC</div></header><div class="tools"><button onclick="document.getElementById('app').classList.toggle('large')">Large text</button><button onclick="document.getElementById('app').classList.toggle('contrast')">High contrast</button></div><section class="screen" id="screen"></section><p class="footer">ACCB6017 • Campus Outbreak Response</p></main>
<script>
const S=document.getElementById('screen');let chosen='';
const btn=(t,n,c='')=>`<button class="${c}" onclick="show('${n}')">${t}</button>`;
function show(id){const pages={home:()=>`<h1>CAMPUS OUTBREAK RESPONSE</h1><p class="sub">Cooperate. Contain. Cure.</p><div class="card"><h2>PANDEMIC: UWTSD EDITION</h2><p>A cooperative campus strategy game.</p></div><div class="actions">${btn('START GAME','mode','primary')}${btn('JOIN GAME','join')}${btn('HOW TO PLAY','help')}${btn('ACCESSIBILITY','access')}</div><div class="note"><h2>Mission</h2><p>Work together across UWTSD campuses, contain outbreaks and discover cures.</p></div>`,mode:()=>`<h1>SELECT PLAY MODE</h1><p class="sub">Choose how the game will run.</p><div class="options"><button class="option selected" onclick="show('join')">SOLO<small>One player with computer support.</small></button><button class="option" onclick="show('join')">PASS & PLAY<small>2–6 players share one device.</small></button><button class="option" onclick="show('join')">ASYNC ONLINE<small>Play at different times.</small></button><button class="option" onclick="show('join')">LIVE ONLINE<small>Everyone plays together.</small></button></div><div class="actions">${btn('BACK','home')}</div>`,join:()=>`<h1>CREATE OR JOIN</h1><p class="sub">Online and local setup.</p><div class="actions">${btn('CREATE NEW GAME','campus','primary')}</div><p class="sub">OR</p><label for="code">Room code</label><input id="code" maxlength="6" placeholder="e.g. UWTSD1"><div class="actions"><button onclick="joinCode()">CONTINUE</button>${btn('BACK','mode')}</div><div class="note"><h2>Error prevention</h2><p>Room codes are checked before joining and clear guidance explains recovery.</p></div>`,campus:()=>`<h1>CHOOSE CAMPUS</h1><p class="sub">Select the outbreak map.</p><div class="options"><button class="option selected" onclick="choose(this,'Birmingham')">BIRMINGHAM<small>Six connected campus zones.</small></button><button class="option" onclick="choose(this,'Swansea')">SWANSEA<small>Waterfront and Mount Pleasant.</small></button><button class="option" onclick="choose(this,'London')">LONDON<small>Kennington campus.</small></button><button class="option" onclick="choose(this,'Carmarthen')">CARMARTHEN<small>Historic campus.</small></button></div><div class="actions">${btn('CONTINUE','role','primary')}</div>`,role:()=>`<h1>CHOOSE YOUR ROLE</h1><p class="sub">Each role has one special ability.</p><div class="options three"><button class="option" onclick="choose(this,'Medic')">MEDIC<small>Treats two infection cubes.</small></button><button class="option" onclick="choose(this,'Researcher')">RESEARCHER<small>Shares knowledge anywhere.</small></button><button class="option" onclick="choose(this,'Security')">SECURITY<small>Protects one campus zone.</small></button><button class="option selected" onclick="choose(this,'IT Support')">IT SUPPORT<small>Restores one disrupted service.</small></button><button class="option" onclick="choose(this,'Librarian')">LIBRARIAN<small>Finds resource cards faster.</small></button><button class="option" onclick="choose(this,'Analyst')">ANALYST<small>Reveals next outbreak risk.</small></button></div><div class="actions">${btn('CONFIRM ROLE','map','primary')}</div>`,map:()=>`<h1>CAMPUS OUTBREAK MAP</h1><p class="sub">Turn 4 • Outbreak level 3/8 • IT Support</p><div class="map"><div class="node n1">1<span>Library</span></div><div class="node n2">3<span>IT Lab</span></div><div class="node n3">2<span>Reception</span></div><div class="node n4">1<span>Café</span></div><div class="node n5">2<span>Lecture Hall</span></div><div class="node n6">0<span>Wellbeing</span></div></div><div class="note"><h2>Current task</h2><p>Treat the IT Lab outbreak. Recommended action: high priority.</p></div><div class="actions two">${btn('VIEW ALERT','alert','primary')}${btn('TEAM STATUS','team')}</div><div class="actions">${btn('CURE PROGRESS','cure')}</div>`,alert:()=>`<h1>OUTBREAK ALERT</h1><p class="sub">Immediate team decision required.</p><div class="alert"><div class="tri">▲</div><h2>NEW OUTBREAK</h2><p><strong>Location:</strong> IT Lab<br><strong>Urgency:</strong> High<br><strong>Effect:</strong> +1 infection cube<br><strong>Suggested:</strong> Treat Outbreak</p></div><div class="actions">${btn('RESPOND NOW','action','danger')}${btn('REVIEW MAP','map')}</div><div class="note"><h2>Calm urgency</h2><p>One clear warning, no flashing animation and a written recommendation.</p></div>`,action:()=>`<h1>PLAYER ACTION</h1><p class="sub">Your turn • 2 actions remaining.</p><div class="options"><button class="option" onclick="choose(this,'Move')">MOVE<small>Travel to an adjacent zone.</small></button><button class="option selected" onclick="choose(this,'Treat Outbreak')">TREAT OUTBREAK<small>Remove one infection cube.</small></button><button class="option" onclick="choose(this,'Share Resource')">SHARE RESOURCE<small>Give a matching card.</small></button><button class="option" onclick="choose(this,'Research Cure')">RESEARCH CURE<small>Add progress at a research station.</small></button></div><div class="note"><h2>Selected action</h2><p>Treat Outbreak • IT Lab • removes one cube.</p></div><div class="actions">${btn('CONFIRM ACTION','cure','primary')}${btn('BACK','alert')}</div>`,cure:()=>`<h1>CURE PROGRESS</h1><p class="sub">Team research status.</p>${progress('BLUE CURE',75,'3/4 cards','')}${progress('RED CURE',50,'2/4 cards','red')}${progress('YELLOW CURE',25,'1/4 cards','yellow')}${progress('BLACK CURE',0,'0/4 cards','')}<div class="note"><h2>Resources needed</h2><p>Blue cure: one matching card. Researcher ability can accelerate progress.</p></div><div class="actions">${btn('RETURN TO MAP','map','primary')}</div>`,team:()=>`<h1>TEAM STATUS</h1><p class="sub">Live view of roles and turns.</p>${member('YOU','IT Support','YOUR TURN','var(--g)')}${member('P2','Medic','READY','var(--s)')}${member('P3','Security','WAITING','var(--b)')}${member('P4','Researcher','OFFLINE','var(--m)')}<div class="note"><h2>Async mode</h2><p>Offline players are notified when it is their turn. The last confirmed action is saved automatically.</p></div><div class="actions">${btn('END TURN','result','primary')}${btn('RETURN TO MAP','map')}</div>`,result:()=>`<h1>MISSION RESULT</h1><p class="sub">Final cooperative outcome.</p><div class="card" style="text-align:center"><div style="font-size:3rem;color:var(--s)">✓</div><h2>CAMPUS SAVED</h2><p>All cures discovered before outbreak level eight.</p></div><div class="options"><div class="card">Outbreaks controlled: <strong>7</strong></div><div class="card">Cures discovered: <strong>4/4</strong></div><div class="card">Team actions: <strong>24</strong></div></div><div class="actions two">${btn('PLAY AGAIN','mode','primary')}${btn('MAIN MENU','home')}</div>`,help:()=>`<h1>HOW TO PLAY</h1><div class="card"><p>Choose a role, coordinate with the team, treat outbreaks, share resources and discover four cures before the outbreak level reaches eight.</p></div><div class="actions">${btn('BACK','home','primary')}</div>`,access:()=>`<h1>ACCESSIBILITY</h1><div class="card"><p>Use the controls above for large text and high contrast. The prototype also uses labelled icons, keyboard focus, reduced colour dependence and no flashing alerts.</p></div><div class="actions">${btn('BACK','home','primary')}</div>`};S.innerHTML=pages[id]();scrollTo(0,0)}
function choose(el,v){document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');chosen=v}
function joinCode(){const c=document.getElementById('code').value.trim();if(c.length<4){alert('Enter a room code of at least four characters.')}else show('campus')}
function progress(n,p,c){return `<div class="card"><div><strong>${n}</strong><span style="float:right">${p}%</span></div><div class="bar"><div class="fill ${c}" style="width:${p}%"></div></div><small>${arguments[2]}</small></div>`}
function member(i,r,s,c){return `<div class="card team"><div><strong>${i} • ${r}</strong><div class="status" style="color:${c}">${s}</div></div><span style="color:${c};font-size:1.6rem">●</span></div>`}show('home');
</script></body></html>
